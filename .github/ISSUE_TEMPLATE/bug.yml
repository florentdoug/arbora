name: Report a bug / Signaler un problème
description: Something does not work as expected. / Quelque chose ne fonctionne pas comme prévu.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thank you! Never attach files with real family data. / Merci ! Ne joins jamais de fichier contenant des données réelles de ta famille."
  - type: input
    id: version
    attributes:
      label: Arbora version / Version d’Arbora
      description: Shown at the bottom of the page or in “About”. / Visible en bas de page ou dans « À propos ».
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device / Navigateur et appareil
      placeholder: "Chrome 131, Windows 11"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened? / Que s’est-il passé ?
      description: Steps to reproduce, what you expected, what you saw. / Les étapes pour reproduire, ce que tu attendais, ce que tu as vu.
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (optional) / Capture d’écran (facultatif)
      description: Hide real names if needed. / Masque les noms réels si besoin.
